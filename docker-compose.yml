services:
  nginx:
    image: nginx:alpine
    container_name: task_management_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --email admin@pavicontech.com -d test1.pavicontech.com --agree-tos -n

  frontend:
    image: ${DOCKERHUB_USERNAME:-sydneymutanyi}/task-management-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_management_frontend
    restart: unless-stopped
    # Exposing internally for nginx
    expose:
      - '80'

  backend:
    image: ${DOCKERHUB_USERNAME:-sydneymutanyi}/task-management-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_management_backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    # Exposing internally for nginx
    expose:
      - '3000'

  mongodb:
    image: mongo:7
    container_name: task_management_mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # Exposed for local development
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host task_management_mongo:27017 --eval
      "rs.initiate({_id:'rs0',members:[{_id:0,host:'task_management_mongo:27017'}]})"

volumes:
  mongo_data:
