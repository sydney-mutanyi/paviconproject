name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/task-management-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/task-management-frontend:latest

      - name: Prepare Server Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: mkdir -p /home/${{ secrets.SERVER_USERNAME }}/task-management

      - name: Copy Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "docker-compose.yml,nginx/"
          target: "/home/${{ secrets.SERVER_USERNAME }}/task-management"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/${{ secrets.SERVER_USERNAME }}/task-management || mkdir -p /home/${{ secrets.SERVER_USERNAME }}/task-management
            cd /home/${{ secrets.SERVER_USERNAME }}/task-management
            
            cat << 'EOF' > deploy.sh
            #!/bin/bash
            set -e

            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"

            # Ensure certbot directories exist
            mkdir -p ./certbot/conf/live/test1.pavicontech.com
            mkdir -p ./certbot/www

            # Create initial dummy SSL certificate if none exists so Nginx can start up cleanly
            if [ ! -f ./certbot/conf/live/test1.pavicontech.com/fullchain.pem ]; then
              echo "Creating initial self-signed SSL certificate for Nginx startup..."
              openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
                -keyout ./certbot/conf/live/test1.pavicontech.com/privkey.pem \
                -out ./certbot/conf/live/test1.pavicontech.com/fullchain.pem \
                -subj '/CN=test1.pavicontech.com'
            fi

            docker compose pull
            docker compose up -d nginx frontend backend mongodb mongo-init
            
            # Wait a few seconds for Nginx to initialize with dummy cert
            sleep 5
            
            # Force run certbot to acquire the real Let's Encrypt certificate
            docker compose up certbot
            
            # Restart Nginx to pick up the newly generated real SSL config
            docker compose restart nginx

            # Wait for backend service to be ready, then run migrations and seed
            echo "Waiting for backend service to be ready..."
            sleep 15
            
            echo "Running Prisma Migrations and Seed..."
            docker compose exec -T backend npx prisma db push --accept-data-loss || true
            docker compose exec -T backend npm run seed || echo "Seed command failed or not configured"
            EOF
            chmod +x deploy.sh
            
            ./deploy.sh

